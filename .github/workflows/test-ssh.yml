name: Test SSH

on:
  workflow_dispatch:  # run manually

jobs:
  ssh-test:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "✅ Connected to VPS!"
            hostname && uptime
            docker ps
