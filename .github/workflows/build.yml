name: Build, Deploy & Cleanup

on:
  push:
    branches:
      - release

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/school-erp-frontend
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/school-erp-backend

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # ✅ Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Login to GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Build + Push frontend
      - name: Build & Push Frontend
        run: |
          docker build -t $IMAGE_FRONTEND:latest ./frontend
          docker push $IMAGE_FRONTEND:latest

      # ✅ Build + Push backend
      - name: Build & Push Backend
        run: |
          docker build -t $IMAGE_BACKEND:latest ./backend
          docker push $IMAGE_BACKEND:latest

      # ✅ Deploy to VPS
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/school-erp
            docker compose pull
            docker compose up -d --force-recreate

  cleanup:
    runs-on: ubuntu-latest
    needs: build-deploy
    steps:
      # ✅ Keep only 2 latest GHCR versions → avoid exceeding free 500MB
      - name: Cleanup frontend images
        uses: actions/delete-package-versions@v5
        with:
          package-name: school-erp-frontend
          package-type: container
          min-versions-to-keep: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup backend images
        uses: actions/delete-package-versions@v5
        with:
          package-name: school-erp-backend
          package-type: container
          min-versions-to-keep: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
