name: Deploy Frontend & Backend

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      # ✅ Detect file changes
      - name: Check changed files
        id: check_changes
        run: |
         echo "frontend_changed=true" >> $GITHUB_OUTPUT
         echo "backend_changed=true" >> $GITHUB_OUTPUT

      # =============================
      # ✅ FRONTEND BUILD & DEPLOY
      # =============================
      - name: Setup Node.js for frontend
        if: steps.check_changes.outputs.frontend_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build frontend (Nuxt SSR)
        if: steps.check_changes.outputs.frontend_changed == 'true'
        working-directory: ./frontend
        env:
          NUXT_PUBLIC_API_BASE: https://schoolapi.digitalfuzed.com/api
        run: |
          npm ci
          echo "🔍 Checking environment variables before build..."
          node scripts/check-env.js
          npm run build

      - name: Upload frontend build to VPS
        if: steps.check_changes.outputs.frontend_changed == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: digitalfuzed-school
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          source: "frontend/.output/."
          target: "/home/digitalfuzed-school/htdocs/school.digitalfuzed.com/"

      - name: Debug frontend upload structure
        if: steps.check_changes.outputs.frontend_changed == 'true'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: digitalfuzed-school
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          script: |
            echo "🔍 DEBUGGING FRONTEND UPLOAD STRUCTURE"
            echo "======================================"
            
            cd /home/digitalfuzed-school/htdocs/school.digitalfuzed.com
            
            echo "📁 Current directory: $(pwd)"
            echo "📁 Directory contents:"
            ls -la
            
            echo ""
            echo "📁 Checking if frontend folder exists:"
            if [ -d "frontend" ]; then
              echo "✅ frontend folder exists"
              echo "📁 frontend folder contents:"
              ls -la frontend/
              
              echo ""
              echo "🔄 Files uploaded to frontend/.output/ directory"
              if [ -d "frontend/.output" ]; then
                echo "✅ Frontend files are ready in frontend/.output/"
                echo "📁 Contents:"
                ls -la frontend/.output/
              fi
            else
              echo "❌ frontend folder does NOT exist"
              echo "📁 Root directory files (these are the uploaded files):"
              ls -la | grep -E "\.(js|css|html|json)$"
            fi
            
            echo ""
            echo "📁 Checking for Nuxt build files:"
            if [ -f "server/index.mjs" ]; then
              echo "✅ server/index.mjs found (Nuxt SSR)"
            fi
            if [ -d "public" ]; then
              echo "✅ public directory found"
              ls -la public/
            fi
            if [ -f "nitro.json" ]; then
              echo "✅ nitro.json found"
            fi
            
            echo ""
            echo "📁 Final directory structure:"
            ls -la
            
            echo ""
            echo "🔍 FRONTEND UPLOAD DEBUG COMPLETE"
            echo "======================================"

      # =============================
      # ✅ BACKEND BUILD & DEPLOY
      # =============================
      - name: Setup Node.js for backend
        if: steps.check_changes.outputs.backend_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps on GitHub Actions
        if: steps.check_changes.outputs.backend_changed == 'true'
        working-directory: ./backend
        run: |
          npm ci --omit=dev

      - name: Package backend (prebuilt)
        if: steps.check_changes.outputs.backend_changed == 'true'
        run: |
          # Package backend contents directly (not the folder)
          tar -czf backend.tar.gz -C backend .

      - name: Upload backend package to VPS
        if: steps.check_changes.outputs.backend_changed == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: digitalfuzed-schoolapi
          key: ${{ secrets.BACKEND_SSH_KEY }}
          source: "backend.tar.gz"
          target: "/home/digitalfuzed-schoolapi/deploy-temp/"

      - name: Extract backend & preserve .env on VPS
        if: steps.check_changes.outputs.backend_changed == 'true'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: digitalfuzed-schoolapi
          key: ${{ secrets.BACKEND_SSH_KEY }}
          script: |
            cd /home/digitalfuzed-schoolapi/htdocs/schoolapi.digitalfuzed.com

            echo "📁 Current structure before deployment:"
            ls -la

            # Backup existing important files
            cp .env /tmp/backend_env_backup 2>/dev/null || echo "No .env to backup"
            cp -r uploads /tmp/uploads_backup 2>/dev/null || echo "No uploads to backup"
            cp -r logs /tmp/logs_backup 2>/dev/null || echo "No logs to backup"

            # Remove any existing backend folder to avoid nesting
            rm -rf backend

            # Extract backend contents directly to current directory
            echo "📦 Extracting backend contents..."
            tar -xzf /home/digitalfuzed-schoolapi/deploy-temp/backend.tar.gz

            # Restore important files
            mv /tmp/backend_env_backup .env 2>/dev/null || echo "No .env to restore"
            cp -r /tmp/uploads_backup/* uploads/ 2>/dev/null || echo "No uploads to restore"
            cp -r /tmp/logs_backup/* logs/ 2>/dev/null || echo "No logs to restore"

            # Cleanup
            rm -rf /tmp/uploads_backup /tmp/logs_backup
            rm /home/digitalfuzed-schoolapi/deploy-temp/backend.tar.gz

            echo "✅ Ensuring exact directory structure..."
            mkdir -p uploads/{documents,receipts,id-cards,logos}
            mkdir -p logs

            echo "📁 Final structure after deployment:"
            ls -la

            echo "✅ Backend deploy complete with exact structure:"
            echo "   /home/digitalfuzed-schoolapi/htdocs/schoolapi.digitalfuzed.com/"
            echo "   ├── uploads/"
            echo "   ├── logs/"
            echo "   └── src/"

      # =============================
      # ✅ RESTART VIA PM2
      # =============================

      - name: Restart frontend with PM2
        if: steps.check_changes.outputs.frontend_changed == 'true'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: digitalfuzed-school
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          script: |
            echo "🔄 Restarting frontend via PM2..."
            cd /home/digitalfuzed-school/htdocs/school.digitalfuzed.com
            
            # Update PM2 to use the correct path
            pm2 stop school-frontend
            pm2 delete school-frontend
            pm2 start frontend/.output/server/index.mjs --name school-frontend --cwd /home/digitalfuzed-school/htdocs/school.digitalfuzed.com
            pm2 save
            
            echo "✅ PM2 updated to use frontend/.output/server/index.mjs"

      - name: Restart backend with PM2
        if: steps.check_changes.outputs.backend_changed == 'true'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: digitalfuzed-schoolapi
          key: ${{ secrets.BACKEND_SSH_KEY }}
          script: |
            echo "🔄 Restarting backend via PM2..."
            cd /home/digitalfuzed-schoolapi/htdocs/schoolapi.digitalfuzed.com
            pm2 reload school-backend
            pm2 save
