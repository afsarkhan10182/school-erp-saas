name: Deploy Frontend & Backend

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # =============================
      # ✅ FRONTEND BUILD & DEPLOY
      # =============================
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build frontend (Nuxt SSR)
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/.output/."
          target: "/home/digitalfuzed-school/htdocs/school.digitalfuzed.com"


      # =============================
      # ✅ BACKEND BUILD & DEPLOY
      # =============================
      - name: Setup Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps on GitHub Actions
        working-directory: ./backend
        run: |
          npm ci --omit=dev

      - name: Package backend (prebuilt)
        run: |
          tar -czf backend.tar.gz -C backend .

      - name: Upload backend package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend.tar.gz"
          target: "/home/deploy-temp/"

      - name: Extract backend on VPS (keep .env safe)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/digitalfuzed-schoolapi/htdocs/schoolapi.digitalfuzed.com
            # Backup existing .env
            cp .env /tmp/backend_env_backup || true

            # Extract new backend build
            tar -xzf /home/deploy-temp/backend.tar.gz -C /home/digitalfuzed-schoolapi/htdocs/schoolapi.digitalfuzed.com

            # Restore .env if it existed
            mv /tmp/backend_env_backup .env || true

            # Clean up
            rm /home/deploy-temp/backend.tar.gz

      # =============================
      # ✅ RESTART BOTH VIA PM2
      # =============================
      - name: Restart frontend & backend with PM2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🔄 Restarting Nuxt frontend via PM2..."
            sudo -u digitalfuzed-school pm2 reload school-frontend || sudo -u digitalfuzed-school pm2 start ~/htdocs/school.digitalfuzed.com/server/index.mjs --name school-frontend

            echo "🔄 Restarting Node.js backend via PM2..."
            sudo -u digitalfuzed-schoolapi pm2 reload school-backend || sudo -u digitalfuzed-schoolapi pm2 start ~/htdocs/schoolapi.digitalfuzed.com/index.js --name school-backend
