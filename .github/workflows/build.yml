name: Deploy Frontend & Backend

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # =============================
      # ✅ FRONTEND DEPLOY
      # =============================
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Upload frontend build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/.output/"
          target: "/home/digitalfuzed-school/htdocs/school.digitalfuzed.com"

      # =============================
      # ✅ BACKEND DEPLOY
      # =============================
      - name: Upload backend code to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/"
          target: "/home/digitalfuzed-schoolapi/htdocs/schoolapi.digitalfuzed.com"

      # ✅ Install backend dependencies only if package.json changed
      - name: Install backend deps & restart services
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "📦 Checking if backend package.json changed..."
            cd /home/digitalfuzed-schoolapi/htdocs/schoolapi.digitalfuzed.com
            if [ "$(md5sum package.json | awk '{print $1}')" != "$(md5sum node_modules/.package-md5 2>/dev/null | awk '{print $1}')" ]; then
              echo "⚡ Installing backend deps..."
              npm install --omit=dev
              md5sum package.json > node_modules/.package-md5
            else
              echo "✅ No package.json change, skipping npm install"
            fi

            echo "🔄 Restarting Node.js apps..."
            pm2 reload all || true

      # ✅ Restart frontend Node.js SSR site
      - name: Restart frontend Node.js site
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "✅ Frontend deployed. Restarting Node.js site..."
            cd /home/digitalfuzed-school/htdocs/school.digitalfuzed.com
            pm2 reload all || true
