name: Deploy Frontend & Backend

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      # ✅ Detect file changes
      - name: Check changed files
        id: check_changes
        run: |
          # First deployment or workflow changes = full deploy
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '\.github/workflows/' > /dev/null; then
            echo "frontend_changed=true" >> $GITHUB_OUTPUT
            echo "backend_changed=true" >> $GITHUB_OUTPUT
          else
            # Check specific changes
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^frontend/' > /dev/null && echo "frontend_changed=true" >> $GITHUB_OUTPUT || echo "frontend_changed=false" >> $GITHUB_OUTPUT
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^backend/' > /dev/null && echo "backend_changed=true" >> $GITHUB_OUTPUT || echo "backend_changed=false" >> $GITHUB_OUTPUT
          fi

      # =============================
      # ✅ FRONTEND BUILD & DEPLOY
      # =============================
      - name: Setup Node.js for frontend
        if: steps.check_changes.outputs.frontend_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build frontend (Nuxt SSR)
        if: steps.check_changes.outputs.frontend_changed == 'true'
        working-directory: ./frontend
        env:
          NUXT_PUBLIC_API_BASE: https://schoolapi.digitalfuzed.com/api
        run: |
          npm ci
          npm run build

      - name: Upload frontend build to VPS
        if: steps.check_changes.outputs.frontend_changed == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/.output/"
          target: "/home/digitalfuzed-school/htdocs/school.digitalfuzed.com/"
          strip_components: 1

      # =============================
      # ✅ BACKEND BUILD & DEPLOY
      # =============================
      - name: Setup Node.js for backend
        if: steps.check_changes.outputs.backend_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps on GitHub Actions
        if: steps.check_changes.outputs.backend_changed == 'true'
        working-directory: ./backend
        run: |
          npm ci --omit=dev

      - name: Package backend (prebuilt)
        if: steps.check_changes.outputs.backend_changed == 'true'
        run: |
          # Package backend contents directly (not the folder)
          tar -czf backend.tar.gz -C backend .

      - name: Upload backend package to VPS
        if: steps.check_changes.outputs.backend_changed == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend.tar.gz"
          target: "/home/digitalfuzed-schoolapi/deploy-temp/"

      - name: Extract backend & preserve .env on VPS
        if: steps.check_changes.outputs.backend_changed == 'true'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/digitalfuzed-schoolapi/htdocs/schoolapi.digitalfuzed.com
            
            # Backup important files
            cp .env /tmp/backend_env_backup 2>/dev/null || true
            cp -r uploads /tmp/uploads_backup 2>/dev/null || true
            cp -r logs /tmp/logs_backup 2>/dev/null || true
            
            # Extract and restore
            tar -xzf /home/digitalfuzed-schoolapi/deploy-temp/backend.tar.gz
            mv /tmp/backend_env_backup .env 2>/dev/null || true
            cp -r /tmp/uploads_backup/* uploads/ 2>/dev/null || true
            cp -r /tmp/logs_backup/* logs/ 2>/dev/null || true
            
            # Setup directories and permissions
            mkdir -p uploads/{documents,receipts,id-cards,logos} logs
            chmod -R 755 uploads/ logs/
            chown -R digitalfuzed-schoolapi:digitalfuzed-schoolapi uploads/ logs/
            
            # Cleanup
            rm -rf /tmp/uploads_backup /tmp/logs_backup
            rm /home/digitalfuzed-schoolapi/deploy-temp/backend.tar.gz

      # =============================
      # ✅ RESTART VIA PM2
      # =============================

      - name: Restart frontend with PM2
        if: steps.check_changes.outputs.frontend_changed == 'true'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: digitalfuzed-school
          key: ${{ secrets.FRONTEND_SSH_KEY }}
          script: |
            cd /home/digitalfuzed-school/htdocs/school.digitalfuzed.com
            source ~/.bashrc && source ~/.nvm/nvm.sh && nvm use default
            pm2 stop school-frontend && pm2 delete school-frontend
            pm2 start .output/server/index.mjs --name school-frontend --cwd /home/digitalfuzed-school/htdocs/school.digitalfuzed.com

      - name: Restart backend with PM2
        if: steps.check_changes.outputs.backend_changed == 'true'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: digitalfuzed-schoolapi
          key: ${{ secrets.BACKEND_SSH_KEY }}
          script: |
            cd /home/digitalfuzed-schoolapi/htdocs/schoolapi.digitalfuzed.com
            source ~/.bashrc && source ~/.nvm/nvm.sh && nvm use default
            pm2 reload school-backend && pm2 save
