name: Build, Deploy & Cleanup (with Cache & Bandwidth Alert)

on:
  push:
    branches:
      - release
  pull_request:
    types:
      - closed

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/school-erp-frontend
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/school-erp-backend

jobs:
 # ✅ 1. Block direct pushes
  block-direct-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Merge pull request')
    steps:
      - name: Block Direct Push
        run: |
          echo "❌ Direct pushes to release branch are not allowed!"
          echo "Please use pull requests instead."
          exit 1

  # ✅ 2. Build, deploy & monitor → only runs if PR merged
  build-deploy:
    runs-on: ubuntu-latest
     # ✅ More reliable PR merge detection
    if: github.event.pull_request.merged == true || github.actor == 'github-actions[bot]'
    steps:
      # ✅ Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Login to GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Build & Push frontend (with cache)
      - name: Build & Push Frontend (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_FRONTEND }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_FRONTEND }}:cache,mode=max

      # ✅ Build & Push backend (with cache)
      - name: Build & Push Backend (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_BACKEND }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_BACKEND }}:cache,mode=max

      # ✅ Deploy to VPS
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🚀 Pulling latest images on VPS..."
            cd /root/school-erp
            docker compose --env-file .env pull --quiet
            docker compose --env-file .env up -d --force-recreate

      # ✅ Check GHCR storage usage
      - name: Check GHCR storage usage
        run: |
          echo "🔍 Checking GHCR storage usage..."
          USED_MB=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/users/${{ github.repository_owner }}/packages?per_page=100 \
            | jq '[.[].package_version[].metadata.container.size] | add / 1024 / 1024' )
          echo "📦 GHCR Storage used: ${USED_MB:-0} MB"
          echo "USED_MB=${USED_MB:-0}" >> $GITHUB_ENV

      # ✅ Check monthly bandwidth usage for GHCR
      - name: Check GHCR Bandwidth Usage
        run: |
          echo "🔍 Checking GHCR bandwidth usage..."
          # Query package usage
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/users/${{ github.repository_owner }}/packages/container/school-erp-frontend/usage \
            > usage.json || true

          # Extract bandwidth (bytes) → MB
          BW_BYTES=$(jq '.bandwidth_usage' usage.json 2>/dev/null || echo 0)
          BW_MB=$(( BW_BYTES / 1024 / 1024 ))
          echo "📡 GHCR Bandwidth used this month: ${BW_MB} MB / 1024 MB"
          echo "BW_MB=${BW_MB}" >> $GITHUB_ENV

          # Warn if >750MB
          if [ "$BW_MB" -gt 750 ]; then
            echo "⚠️ WARNING: Bandwidth usage above 750MB → Consider reducing deploys or cleanup rollback versions!"
            echo "BANDWIDTH_WARNING=1" >> $GITHUB_ENV
          else
            echo "BANDWIDTH_WARNING=0" >> $GITHUB_ENV
          fi

      # ✅ Add Deployment Summary
      - name: Add Deployment Summary
        run: |
          echo "## ✅ Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Frontend & Backend built with **layer caching**" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployed to VPS" >> $GITHUB_STEP_SUMMARY
          echo "📦 GHCR Storage used: ${USED_MB:-0} MB / 500 MB free limit" >> $GITHUB_STEP_SUMMARY
          echo "📡 GHCR Bandwidth used: ${BW_MB:-0} MB / 1 GB free limit" >> $GITHUB_STEP_SUMMARY
          if [ "$BANDWIDTH_WARNING" -eq 1 ]; then
            echo "⚠️ **Bandwidth above 750 MB! You may hit 1 GB limit soon!**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Layer caching reduces transfer size per deploy!_" >> $GITHUB_STEP_SUMMARY

  cleanup:
    runs-on: ubuntu-latest
    needs: build-deploy
    steps:
      # ✅ Keep only 2 latest GHCR versions → avoid exceeding free 500MB
      - name: Cleanup frontend images
        uses: actions/delete-package-versions@v5
        with:
          package-name: school-erp-frontend
          package-type: container
          min-versions-to-keep: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup backend images
        uses: actions/delete-package-versions@v5
        with:
          package-name: school-erp-backend
          package-type: container
          min-versions-to-keep: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
