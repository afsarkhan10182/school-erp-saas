name: Deploy Frontend & Backend

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      # ✅ Detect file changes
      - name: Check changed files
        id: check_changes
        run: |
         echo "frontend_changed=true" >> $GITHUB_OUTPUT
         echo "backend_changed=true" >> $GITHUB_OUTPUT

      # =============================
      # ✅ FRONTEND BUILD & DEPLOY
      # =============================
      - name: Setup Node.js for frontend
        if: steps.check_changes.outputs.frontend_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build frontend (Nuxt SSR)
        if: steps.check_changes.outputs.frontend_changed == 'true'
        working-directory: ./frontend
        env:
          NUXT_PUBLIC_API_BASE: https://schoolapi.digitalfuzed.com/api
        run: |
          npm ci
          echo "🔍 Checking environment variables before build..."
          node scripts/check-env.js
          npm run build

      - name: Upload frontend build to VPS
        if: steps.check_changes.outputs.frontend_changed == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/.output/."
          target: "/home/digitalfuzed-school/htdocs/school.digitalfuzed.com"

      # =============================
      # ✅ BACKEND BUILD & DEPLOY
      # =============================
      - name: Setup Node.js for backend
        if: steps.check_changes.outputs.backend_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps on GitHub Actions
        if: steps.check_changes.outputs.backend_changed == 'true'
        working-directory: ./backend
        run: |
          npm ci --omit=dev

      - name: Package backend (prebuilt)
        if: steps.check_changes.outputs.backend_changed == 'true'
        run: |
          # Package backend contents directly (not the folder)
          tar -czf backend.tar.gz -C backend .

      - name: Upload backend package to VPS
        if: steps.check_changes.outputs.backend_changed == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend.tar.gz"
          target: "/home/deploy-temp/"

      - name: Extract backend & set permissions on VPS (as root)
        if: steps.check_changes.outputs.backend_changed == 'true'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/digitalfuzed-schoolapi/htdocs/schoolapi.digitalfuzed.com

            echo "📁 Current structure before deployment:"
            ls -la

            # Backup existing important files
            cp .env /tmp/backend_env_backup 2>/dev/null || echo "No .env to backup"
            cp -r uploads /tmp/uploads_backup 2>/dev/null || echo "No uploads to backup"
            cp -r logs /tmp/logs_backup 2>/dev/null || echo "No logs to backup"

            # Remove any existing backend folder to avoid nesting
            rm -rf backend

            # Extract backend contents directly to current directory
            echo "📦 Extracting backend contents..."
            tar -xzf /home/deploy-temp/backend.tar.gz

            # Restore important files
            mv /tmp/backend_env_backup .env 2>/dev/null || echo "No .env to restore"
            cp -r /tmp/uploads_backup/* uploads/ 2>/dev/null || echo "No uploads to restore"
            cp -r /tmp/logs_backup/* logs/ 2>/dev/null || echo "No logs to restore"

            # Cleanup
            rm -rf /tmp/uploads_backup /tmp/logs_backup
            rm /home/deploy-temp/backend.tar.gz

            echo "✅ Ensuring exact directory structure..."
            mkdir -p uploads/{documents,receipts,id-cards,logos}
            mkdir -p logs

            echo "✅ Fixing ownership & permissions (using sudo)..."
            # Set correct ownership for all files (using sudo)
            sudo chown -R digitalfuzed-schoolapi:digitalfuzed-schoolapi .
            
            # Set proper permissions
            sudo find . -type d -exec chmod 755 {} \;
            sudo find . -type f -exec chmod 644 {} \;
            
            # Special permissions for uploads and logs
            sudo chmod -R 755 uploads
            sudo chmod -R 755 logs
            
            # Make index.js executable
            sudo chmod +x index.js

            echo "📁 Final structure after deployment:"
            ls -la

            echo "✅ Backend deploy complete with exact structure:"
            echo "   /home/digitalfuzed-schoolapi/htdocs/schoolapi.digitalfuzed.com/"
            echo "   ├── uploads/"
            echo "   ├── logs/"
            echo "   └── src/"

            # Update .env with production CORS settings if it exists
            if [ -f .env ]; then
              echo "🔧 Updating CORS configuration for production..."
              # Add or update CORS_ORIGIN in .env
              if grep -q "CORS_ORIGIN" .env; then
                sed -i 's|CORS_ORIGIN=.*|CORS_ORIGIN=https://school.digitalfuzed.com|' .env
              else
                echo "CORS_ORIGIN=https://school.digitalfuzed.com" >> .env
              fi
              echo "✅ CORS configuration updated"
            fi

      # =============================
      # ✅ RESTART VIA PM2
      # =============================

      - name: Restart frontend with PM2
        if: steps.check_changes.outputs.frontend_changed == 'true'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🔄 Restarting frontend via PM2..."
            sudo -u digitalfuzed-school pm2 reload school-frontend
            sudo -u digitalfuzed-school pm2 save

      - name: Restart backend with PM2
        if: steps.check_changes.outputs.backend_changed == 'true'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🔄 Restarting backend via PM2..."
            sudo -u digitalfuzed-schoolapi pm2 reload school-backend
            sudo -u digitalfuzed-schoolapi pm2 save
