version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: school-erp-postgres
    environment:
      POSTGRES_DB: school_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - school-erp-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: school-erp-redis
    networks:
      - school-erp-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school-erp-backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres123
      DB_NAME: school_erp
      REDIS_ENABLED: true
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-jwt-secret-key
      CORS_ORIGIN: http://localhost:3000
      UPLOADS_DIR: /app/uploads
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
    networks:
      - school-erp-network
    command: npm run dev

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school-erp-frontend
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      args:
      NUXT_PUBLIC_API_BASE: http://localhost:4000/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
      - frontend_output:/app/.output
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - school-erp-network
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  frontend_node_modules:
    driver: local
  frontend_nuxt:
    driver: local
  frontend_output:
    driver: local

networks:
  school-erp-network:
    driver: bridge 